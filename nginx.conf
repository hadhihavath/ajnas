# Nginx Reverse Proxy Configuration for Hostinger VPS
# Place in /etc/nginx/sites-available/youtube-downloader and symlink to /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name YOUR_HOSTINGER_DOMAIN_OR_IP;

    # Maximum file upload/request size
    client_max_body_size 100M;

    # Root proxy to Node.js / Docker container on port 3000
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts for longer video processing
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # CRITICAL: Disable buffering for Server-Sent Events (SSE) live progress updates
    location /api/progress/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
    }

    # Enable byte range requests for in-browser video seeking & playback
    location /api/preview/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
    }
}
